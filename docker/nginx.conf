# Runs INSIDE the wolfbot-community container (behind wolfbot-platform's
# shared nginx, which only proxy_passes community.wolfbot.io here — see
# wolfbot-platform/nginx/nginx.conf). This is where the site's own routing
# lives, so the image is self-contained and portable (can be `docker run`
# standalone for local preview too).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Was Cloudflare Pages public/_redirects; kept as plain nginx redirects
    # now that the site is served from this container instead.
    location = /docs {
        return 301 /getting-started;
    }

    # PLAN §4 lists /markets as a hub. There is no dedicated /markets index —
    # /brokers (content-driven hub + per-broker page crosslinks, plan §8) is
    # where "which markets does WolfBot support" is actually answered. Route
    # /markets there to keep every plan URL live without creating a thin,
    # duplicated page (plan §12 / §18 warn against that). Same pattern as
    # /docs, /install, /releases below.
    location = /markets {
        return 301 /brokers;
    }

    # PLAN §7 wants /install/vps; the in-depth VPS guide lives at
    # /docs/run-24-7-on-a-vps (content/docs/run-24-7-on-a-vps.md) to stay
    # grouped with docs/. Mirror the old plan URL rather than duplicating
    # content (avoids a thin/duplicate page). Same pattern as /docs above.
    location = /install/vps {
        return 301 /docs/run-24-7-on-a-vps;
    }

    # Breadcrumbs on /install/* pages emit an "Install" parent crumb (see
    # slugToBreadcrumbs in lib/content.ts). There is no /install index; route
    # the parent to Getting Started so the crumb never 404s -- same treatment
    # as /docs above.
    location = /install {
        return 301 /getting-started;
    }

    location = /github {
        return 302 https://github.com/wolfbot-io/wolfbot-community;
    }

    # GitHub's /releases/latest alias only ever resolves to the most recent
    # release that is neither a draft nor a prerelease -- this repo's only
    # release so far is intentionally `prerelease: true` (Public Preview),
    # so /latest would never match it. Point at the full list instead,
    # which shows prereleases fine.
    location = /releases/latest {
        return 302 https://github.com/wolfbot-io/wolfbot-community/releases;
    }

    # No dedicated /releases index page yet -- only /releases/channels
    # (content/releases/channels.md) exists. Same pattern as the /docs
    # redirect above.
    location = /releases {
        return 301 /releases/channels;
    }

    # Section 100: plan wants /status as the route; content lives at
    # content/docs/community-status.md (served at /docs/community-status
    # by the [...slug] catch-all) to stay grouped with the rest of docs/.
    location = /status {
        return 301 /docs/community-status;
    }

    # Was Cloudflare Pages public/_headers: hashed Next.js export assets are
    # immutable, cache them hard. `^~` so the media regex below cannot
    # override this for /_next files (JS/CSS keep their real hashed URLs).
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # /screenshots/ images do NOT have content-hashed filenames, so
    # `immutable` (applied by the general image regex below, before this fix)
    # pinned the old screenshots for a full year in browser + Cloudflare
    # caches -- the exact bug where the live site kept serving old UI images.
    # Screenshots change whenever the product UI is re-shot, so cache them
    # briefly and revalidate. `^~` stops nginx from then testing the image
    # regex and overriding us.
    location ^~ /screenshots/ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    # All OTHER media (favicon, og images, logos, article thumbnails, ...)
    # live in public/ with NON-hashed filenames too (only /_next/static/*
    # gets immutable). Serving them with `immutable`/1-year is the same trap:
    # replacing a logo or og:image at the same path would never propagate. So
    # cache them for a short TTL and always allow revalidation. The
    # `^~`-prefixed /screenshots/ location above wins over this regex for
    # screenshot files; every other non-hashed media asset falls back here.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|gif|css|js|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    # HTML pages: Next static export produces a new index.html per deploy, so
    # never let caches serve a stale page. no-cache = always revalidate, which
    # is cheap here (tiny site) and guarantees the newest content shows up.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
