# Runs INSIDE the wolfbot-community container (behind wolfbot-platform's
# shared nginx, which only proxy_passes community.wolfbot.io here — see
# wolfbot-platform/nginx/nginx.conf). This is where the site's own routing
# lives, so the image is self-contained and portable (can be `docker run`
# standalone for local preview too).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Was Cloudflare Pages public/_redirects; kept as plain nginx redirects
    # now that the site is served from this container instead.
    location = /docs {
        return 301 /getting-started;
    }

    location = /github {
        return 302 https://github.com/wolfbot-io/wolfbot-community;
    }

    # GitHub's /releases/latest alias only ever resolves to the most recent
    # release that is neither a draft nor a prerelease -- this repo's only
    # release so far is intentionally `prerelease: true` (Public Preview),
    # so /latest would never match it. Point at the full list instead,
    # which shows prereleases fine.
    location = /releases/latest {
        return 302 https://github.com/wolfbot-io/wolfbot-community/releases;
    }

    # No dedicated /releases index page yet -- only /releases/channels
    # (content/releases/channels.md) exists. Same pattern as the /docs
    # redirect above.
    location = /releases {
        return 301 /releases/channels;
    }

    # Locale roots (e.g. /vi, /vi/, /de/, /ja/) have no landing/index page —
    # localized content is served as flat `/<locale>/*.html` files with no
    # hub. Redirect every locale root to that language's Getting Started page
    # so a direct hit on /vi/ doesn't fall through to a 403 (no directory
    # listing) or 404. Pattern mirrors the /docs + /releases redirects above.
    # `$1` captures the locale segment; redirect keeps the locale + avoids
    # canonicalization/duplicate-content warnings from a bare trailing slash.
    location ~ ^/(vi|zh|pt-br|ru|de|ja|ko|hi)/?$ {
        return 301 /$1/getting-started;
    }

    # Section 100: plan wants /status as the route; content lives at
    # content/docs/community-status.md (served at /docs/community-status
    # by the [...slug] catch-all) to stay grouped with the rest of docs/.
    location = /status {
        return 301 /docs/community-status;
    }

    # Was Cloudflare Pages public/_headers: hashed Next.js export assets are
    # immutable, cache them hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Next static export writes flat `<route>.html` files
    # (e.g. /brokers/bybit -> brokers/bybit.html), not
    # `<route>/index.html`, so the fallback must try the `.html` sibling
    # before giving up.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
