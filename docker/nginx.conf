# Runs INSIDE the wolfbot-community container (behind wolfbot-platform's
# shared nginx, which only proxy_passes community.wolfbot.io here — see
# wolfbot-platform/nginx/nginx.conf). This is where the site's own routing
# lives, so the image is self-contained and portable (can be `docker run`
# standalone for local preview too).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Was Cloudflare Pages public/_redirects; kept as plain nginx redirects
    # now that the site is served from this container instead.
    location = /docs {
        return 301 /getting-started;
    }

    location = /github {
        return 302 https://github.com/wolfbot-io/wolfbot-community;
    }

    location = /releases/latest {
        return 302 https://github.com/wolfbot-io/wolfbot-community/releases/latest;
    }

    # Was Cloudflare Pages public/_headers: hashed Next.js export assets are
    # immutable, cache them hard.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Next static export writes flat `<route>.html` files
    # (e.g. /brokers/bybit -> brokers/bybit.html), not
    # `<route>/index.html`, so the fallback must try the `.html` sibling
    # before giving up.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
